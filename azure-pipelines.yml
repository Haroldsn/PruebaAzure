trigger:
  branches:
    include:
      - main
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: AWS_REGION
    value: 'us-east-1'
  - name: S3_BUCKET
    value: 'pruebas-devops1'
  - name: EB_APPLICATION
    value: 'Pruebas'
  - name: EB_ENVIRONMENT
    value: 'Harold_Orostegui-env'
  - name: ARTIFACT_NAME
    value: 'Harold_Orostegui_Alfonso-$(Build.BuildId)'

stages:
  - stage: Build
    displayName: 'Build y Empaquetado'
    jobs:
      - job: BuildJob
        steps:
          - task: UsePythonVersion@0
            displayName: 'Configurar Python 3.11'
            inputs:
              versionSpec: '3.11'

          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: 'Instalar dependencias'

          - task: ArchiveFiles@2
            displayName: 'Empaquetar ZIP'
            inputs:
              rootFolderOrFile: '$(Build.SourcesDirectory)'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/$(ARTIFACT_NAME).zip'

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)'
              artifact: 'drop'

  - stage: Deploy
    displayName: 'Deploy a AWS'
    dependsOn: Build
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')))
    jobs:
      - deployment: DeployAWS
        displayName: 'Deploy a S3 y Beanstalk'
        environment: 'Harold_Orostegui-env'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AWSCLI@1
                  displayName: 'Validar entorno EB'
                  inputs:
                    awsCredentials: 'AWS'
                    regionName: '$(AWS_REGION)'
                    awsCommand: 'elasticbeanstalk'
                    awsSubCommand: 'describe-environments'
                    awsArguments: >
                      --application-name $(EB_APPLICATION)
                      --environment-names $(EB_ENVIRONMENT)

                - task: AWSCLI@1
                  displayName: 'Crear entorno EB si no existe'
                  inputs:
                    awsCredentials: 'AWS'
                    regionName: '$(AWS_REGION)'
                    awsCommand: 'elasticbeanstalk'
                    awsSubCommand: 'create-environment'
                    awsArguments: >
                      --application-name $(EB_APPLICATION)
                      --environment-name $(EB_ENVIRONMENT)
                      --solution-stack-name "64bit Amazon Linux 2 v3.5.6 running Python 3.11"

                - task: S3Upload@1
                  displayName: 'Subir ZIP'
                  inputs:
                    awsCredentials: 'AWS'
                    regionName: '$(AWS_REGION)'
                    bucketName: '$(S3_BUCKET)'
                    sourceFolder: '$(Pipeline.Workspace)/drop'
                    globExpressions: '$(ARTIFACT_NAME).zip'

                - task: BeanstalkDeployApplication@1
                  displayName: 'Deploy a Elastic Beanstalk'
                  inputs:
                    awsCredentials: 'AWS'
                    regionName: '$(AWS_REGION)'
                    applicationName: '$(EB_APPLICATION)'
                    environmentName: '$(EB_ENVIRONMENT)'
                    applicationType: 's3'
                    deploymentBundleBucket: '$(S3_BUCKET)'
                    deploymentBundleKey: '$(ARTIFACT_NAME).zip'
                    versionLabel: '$(ARTIFACT_NAME)'

