trigger:
  branches:
    include:
      - main
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: AWS_REGION
    value: 'us-east-1'
  - name: S3_BUCKET
    value: 'pruebas-devops1'
  - name: EB_APPLICATION
    value: 'Pruebas'
  - name: EB_ENVIRONMENT
    value: 'Harold_Orostegui-env'
  - name: ARTIFACT_NAME
    value: 'Harold_Orostegui-$(Build.BuildId)'

stages:
  - stage: Build
    displayName: 'Build y Empaquetado'
    jobs:
      - job: BuildJob
        steps:
          - task: UsePythonVersion@0
            displayName: 'Configurar Python 3.11'
            inputs:
              versionSpec: '3.11'

          - script: |
              python -m pip install --upgrade pip
            displayName: 'Instalar dependencias'

          - task: ArchiveFiles@2
            displayName: 'Empaquetar ZIP'
            inputs:
              rootFolderOrFile: '$(Build.SourcesDirectory)'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/$(ARTIFACT_NAME).zip'

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)'
              artifact: 'drop'

  - stage: Deploy
    displayName: 'Deploy a AWS'
    dependsOn: Build
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')))
    jobs:
      - deployment: DeployAWS
        displayName: 'Deploy a S3 y Beanstalk'
        environment: 'Harold_Orostegui-env'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    #!/bin/bash
                    set -e

                    APP_NAME="Pruebas"
                    ENV_NAME="Harold_Orostegui-env"
                    REGION="us-east-1"
                    SOLUTION_STACK="64bit Amazon Linux 2023 v4.0.3 running Python 3.11"

                    # Verificar si la aplicación existe
                    APP_EXISTS=$(aws elasticbeanstalk describe-applications --region $REGION --query "Applications[?ApplicationName=='$APP_NAME']" --output text)
                    if [ -z "$APP_EXISTS" ]; then
                      echo "Creando aplicación $APP_NAME..."
                      aws elasticbeanstalk create-application --application-name $APP_NAME --region $REGION
                    else
                      echo "Aplicación $APP_NAME ya existe."
                    fi

                    # Verificar si el environment existe
                    ENV_EXISTS=$(aws elasticbeanstalk describe-environments --application-name $APP_NAME --region $REGION --query "Environments[?EnvironmentName=='$ENV_NAME']" --output text)
                    if [ -z "$ENV_EXISTS" ]; then
                      echo "Creando environment $ENV_NAME..."
                      aws elasticbeanstalk create-environment \
                        --application-name $APP_NAME \
                        --environment-name $ENV_NAME \
                        --solution-stack-name "$SOLUTION_STACK" \
                        --region $REGION
                    else
                      echo "Environment $ENV_NAME ya existe."
                    fi
                  displayName: 'Crear Application y Environment en Elastic Beanstalk'

                - task: S3Upload@1
                  displayName: 'Subir ZIP a S3'
                  inputs:
                    awsCredentials: 'AWS'
                    regionName: '$(AWS_REGION)'
                    bucketName: '$(S3_BUCKET)'
                    sourceFolder: '$(Pipeline.Workspace)/drop'
                    globExpressions: '$(ARTIFACT_NAME).zip'

                - task: BeanstalkDeployApplication@1
                  displayName: 'Deploy a Elastic Beanstalk'
                  inputs:
                    awsCredentials: 'AWS'
                    regionName: '$(AWS_REGION)'
                    applicationName: '$(EB_APPLICATION)'
                    environmentName: '$(EB_ENVIRONMENT)'
                    applicationType: 's3'
                    deploymentBundleBucket: '$(S3_BUCKET)'
                    deploymentBundleKey: '$(ARTIFACT_NAME).zip'
                    versionLabel: '$(ARTIFACT_NAME)'
